name: Build desktop app

# Builds the Windows and macOS installers on their real, native runners —
# a Tauri app can't be cross-compiled from Linux since it embeds the OS's
# own webview (WebView2 on Windows, WKWebView on macOS).
#
# Run manually any time (Actions tab -> this workflow -> Run workflow) to
# just get installers as downloadable build artifacts on the run's summary
# page. Pushing a tag like "v1.0.0" does the same build and additionally
# creates a draft GitHub Release with the installers attached.
#
# Unsigned for now (see README) — installing will show an "unknown
# publisher" / "unidentified developer" warning until code signing is set
# up for each OS.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (also builds the web frontend first)
        run: npx tauri build ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: draft-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*setup*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*
