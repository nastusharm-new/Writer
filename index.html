<!doctype html>
<!--
  lang="ru" + translate="no" + the notranslate meta below: the app is
  Russian-only, but the page was previously mis-tagged as English, which is
  exactly what makes Chrome (and Yandex Browser) offer to auto-translate it.
  That auto-translate then collides with React's own DOM updates and
  corrupts short labels mid-render ("Без названия" -> "Безмо", etc.) — this
  isn't a text bug in the app, it's the browser rewriting text nodes React
  is also managing. Opting out of translation entirely is the real fix.
-->
<html lang="ru" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>Draft</title>
  </head>
  <body>
    <div id="root" class="notranslate" translate="no"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
